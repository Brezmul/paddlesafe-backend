version: 2
updates:
  # Actualizaciones automáticas semanales para dependencias npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "quality"
    commit-message:
      prefix: "chore(deps)"

  # Actualizaciones automáticas semanales para GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 10
    labels:
      - "actions"
      - "ci"
    commit-message:
      prefix: "ci(actions)"

